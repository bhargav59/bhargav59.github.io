  <!-- Prevent theme flicker -->
  <script>
    (function() {
      try {
        const storedTheme = localStorage.getItem('portfolio-theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
